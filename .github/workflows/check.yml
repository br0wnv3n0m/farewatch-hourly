name: Hourly flight check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farewatch-hourly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Check fares and report to dashboard
        env:
          FAREWATCH_URL: ${{ secrets.FAREWATCH_URL }}
          FAREWATCH_RUNNER_TOKEN: ${{ secrets.FAREWATCH_RUNNER_TOKEN }}
        run: python runner.py
