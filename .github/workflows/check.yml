name: Hourly flight check

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: farewatch-hourly
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether an hourly fare check is due
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 schedule_gate.py
  check:
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Check fares and report to dashboard
        env:
          FAREWATCH_URL: ${{ secrets.FAREWATCH_URL }}
          FAREWATCH_RUNNER_TOKEN: ${{ secrets.FAREWATCH_RUNNER_TOKEN }}
        run: python runner.py
